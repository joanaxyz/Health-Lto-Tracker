<section class="lto-progress-shell">
  <div class="lto-progress-header">
    <div>
      <div class="lto-progress-eyebrow">Document readiness</div>
      <h2 class="lto-progress-title">Checklist progress</h2>
    </div>
    <p class="lto-progress-note">
      Prioritized by upcoming expiry dates so incomplete packs are easier to spot.
    </p>
  </div>

  <div ng-if="licenses.length === 0" class="lto-progress-empty">
    No licenses currently need checklist attention.
  </div>

  <div class="lto-progress-list" ng-if="licenses.length > 0">
    <button
      type="button"
      class="lto-progress-item"
      ng-repeat="lic in licenses"
      ng-click="openLicense(lic.sys_id)"
      title="{{lic.license_number}} - {{lic.facility}}"
    >
      <div class="lto-progress-row">
        <div>
          <div class="lto-progress-name" ng-bind="lic.license_number"></div>
          <div class="lto-progress-facility" ng-bind="lic.facility"></div>
        </div>
        <div class="lto-progress-side">
          <span
            class="lto-progress-days"
            ng-class="{
              'lto-progress-days-danger': lic.days < 30,
              'lto-progress-days-warning': lic.days >= 30 && lic.days < 60
            }"
            ng-bind="lic.days + 'd'"
          ></span>
          <span class="lto-progress-pct" ng-bind="lic.pct + '%'"></span>
        </div>
      </div>

      <div class="lto-progress-caption">Checklist completion</div>
      <div class="progress lto-progress-bar">
        <div
          class="progress-bar {{lic.bar_class}}"
          role="progressbar"
          ng-style="{'width': lic.pct + '%'}"
          aria-valuenow="{{lic.pct}}"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </button>
  </div>
</section>
